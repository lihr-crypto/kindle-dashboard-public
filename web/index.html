<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle Dashboard</title><link rel="stylesheet" href="/app.css"></head>
<body><header><h1>Kindle Dashboard</h1><p>天气日历 · 待办额度 · <a href="/mobile">打开手机工作台</a></p></header>
<section id="login" hidden><h2>登录管理页</h2><form id="login-form"><label>管理密钥<input id="login-token" type="password" autocomplete="current-password" required></label><button>登录</button></form><p>本机浏览器可直接访问。其他设备使用本机管理页提供的密钥。</p></section>
<main id="main" hidden>
<nav><button data-page="weather">天气日历</button><button data-page="work">待办额度</button><label><input type="checkbox" id="demo"> 示例预览</label><button id="refresh">刷新数据</button></nav>
<div class="layout"><section class="preview-area"><p id="preview-label"></p><a id="preview-link" target="_blank" rel="noopener"><img id="preview-image" alt="竖屏 Dashboard 预览"></a><div class="exports"><a id="png-download" download>下载 PNG</a><a id="svg-download" download>下载 SVG</a><a id="full-preview" target="_blank" rel="noopener">独立预览</a></div></section>
<div class="manage"><section><h2>数据状态</h2><div id="statuses"></div></section>
<section><h2>待办事项</h2><form id="todo-form"><input id="todo-id" type="hidden"><label>事项<input id="todo-title" maxlength="100" placeholder="今天需要做什么？" required></label><div class="row"><label>截止时间<input id="todo-due" type="datetime-local"></label><label>优先级<select id="todo-priority"><option value="normal">普通</option><option value="high">优先</option></select></label></div><div class="row"><button id="todo-save">添加事项</button><button id="todo-cancel" type="button" hidden>取消编辑</button></div></form><div id="todo-list"></div></section>
<section><h2>天气地点</h2><p id="location-label"></p><div class="row"><button id="use-location">使用当前位置</button><label><input id="follow-location" type="checkbox"> 页面打开时自动更新位置</label></div><p id="location-note"></p><form id="location-search"><label>搜索城市<input id="city-search" placeholder="例如 东京、深圳、上海" required></label><button>搜索</button></form><div id="location-results"></div><details><summary>经纬度与时区</summary><form id="location-manual"><label>城市名称<input id="city-name" required maxlength="60"></label><div class="row"><label>纬度<input id="latitude" type="number" step="any" min="-90" max="90" required></label><label>经度<input id="longitude" type="number" step="any" min="-180" max="180" required></label></div><label>时区<input id="time-zone" required placeholder="Asia/Tokyo"></label><button>保存地点</button></form></details></section>
<section><h2>其他设备访问</h2><p>在同一个网络打开本机地址，用管理密钥登录手机页面；设备密钥仅能读取画面。</p><button id="show-access">显示访问密钥</button><pre id="access-info" hidden></pre></section>
</div></div></main><p id="message" role="status" aria-live="polite"></p><footer>本机开发服务 · Kindle 实机验收待设备就绪</footer><script src="/app.js"></script></body></html>
